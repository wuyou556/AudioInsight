version: '3.8'

services:
  db:
    image: postgres:15
    container_name: audioinsight-db
    environment:
      POSTGRES_USER: audioinsight
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audioinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audioinsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: audioinsight-app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./uploads:/app/uploads
      - ./alembic.ini:/app/alembic.ini
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://audioinsight:password@db:5432/audioinsight
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
